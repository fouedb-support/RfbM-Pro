<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Radio fouedb Music Webplayer">

<title>Radio fouedb Music</title>

<link rel="shortcut icon" href="https://radiofouedbmusic.weebly.com/uploads/2/7/3/9/27392993/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>

</head>

<body>

<div id="lockScreen">
<h3>Restricted access</h3>

<input
type="email"
id="accessEmail"
placeholder="Your e-mail">

<input
type="password"
id="accessCode"
placeholder="Enter your code">
 
<button id="unlockBtn">Unlock</button>

        <a
            id="radioBackBtn"
            href="https://fouedb-support.github.io/RfbM-Playlists-Player-Pro/"
            target="_self"
            rel="noopener noreferrer"
        >
            Return To RfbM Playlists
        </a>
                
        <a
            id="rfbmSubscribeLink"
            href="https://radiofouedbmusic.weebly.com/subscribe.html"
            target="_blank"
            rel="noopener noreferrer"
        >
            Subscribe to RfbM (Live+Playlists)
        </a>
 
<div id="errorMsg"></div>
</div>

<button id="modeSwitch" class="mode-btn autodj-mode">
  <img class="icon" src="https://radiofouedbmusic.weebly.com/uploads/2/7/3/9/27392993/autodj-rfbm.png" alt="AutoDJ" />
</button>

<button id="logoutBtn">Log out</button>

<button id="playlistsBtn" style="display:none;">RfbM Playlists</button>

<button id="autoHideToggle" class="auto-hide-btn active"></button>

<div id="autoHideSongInfo">

    <div id="autoHideTitle"></div>

    <div id="autoHideArtist"></div>

    <div id="autoHideTimer">

        <span id="autoHideElapsed">
            00:00
        </span>

        <span class="autoHideSeparator">
            /
        </span>

        <span id="autoHideDuration">
            00:00
        </span>

        <span
            id="autoHideRemaining"
            class="autoHideRemaining">

            (-00:00)

        </span>

    </div>

    <div id="autoHideProgressContainer">

        <div id="autoHideProgressBar"></div>

    </div>
    
    <div id="autoHideRadioName">Radio fouedb Music</div>

</div>

<div class="player-wrapper">

<div id="player" class="player" style="display:none;">

<div class="player-layout">


    <div class="left-section">

    <div class="album-section">

        <div class="album-art">

            <img
                id="cover"
                src="https://radiofouedbmusic.weebly.com/uploads/2/7/3/9/27392993/noalbum-white-2.png"
                alt="cover"> 


            <div class="live-badge">

                <span class="live-dot"></span>

                LIVE

            </div>


            <div class="rfbm">

                <span class="radio-name"></span>

                RFBM

            </div>

        </div>

    </div>
    
    </div>
    
    <div class="section-separator"></div>
    

    <div class="right-column">
    

    <div class="center-section">

    <div class="info-section">

        <div
            id="title"
            class="title">

            Loading...

        </div>

        <div
            id="artist"
            class="artist">

        </div>

        <div
            id="album"
            class="album">

        </div>


        <div class="progress-container">

            <div
                id="progressBar"
                class="progress-bar">

            </div>

        </div>


        <div class="timer">

            <span id="elapsed">

                00:00

            </span>

            <span class="separator">

                /

            </span>

            <span id="duration">

                00:00

            </span>

            <span
                id="remaining"
                class="remaining">

                (-00:00)

            </span>

        </div>


        <div
            id="networkStatus"
            class="network-online">

            <span
                class="network-dot">

            </span>

            <span
                id="networkText">

                CONNECTED

            </span>

        </div>


        <div class="volume-container">

            <i class="fas fa-volume-up"></i>

            <input
                id="volume"
                type="range"
                min="0"
                max="100"
                value="80">

        </div>

    </div>
    
    </div>
    

    <div class="right-section">

    <div class="controls-section">
        

        <div
            id="codecInfo">

                MP3 • CODEC • 320 kbps

        </div>


        <div class="codec-buttons">

            <button
                id="mp3Btn"
                class="codec-btn active">

                MP3

            </button>

            <button
                id="aacBtn"
                class="codec-btn">

                AAC

            </button>

            <button
                id="m4aBtn"
                class="codec-btn">

                M4A

            </button>

        </div>
        

        <div class="controls">

            <button
                id="playBtn"
                class="control-btn play">

                <img
                    id="playIcon"
                    src="https://radiofouedbmusic.weebly.com/uploads/2/7/3/9/27392993/play-rfbm.png"
                    alt="play">

            </button>

            <button
                id="stopBtn"
                class="control-btn stop">

                <img
                    src="https://radiofouedbmusic.weebly.com/uploads/2/7/3/9/27392993/stop-rfbm.png"
                    alt="stop">

            </button>

            <button
                id="muteBtn"
                class="control-btn mute">

                <img
                    id="muteIcon"
                    src="https://radiofouedbmusic.weebly.com/uploads/2/7/3/9/27392993/volume-rfbm.png"
                    alt="mute">

            </button>

            <button
                id="refreshBtn"
                class="control-btn refresh">

                <img
                    id="refreshIcon"
                    src="https://radiofouedbmusic.weebly.com/uploads/2/7/3/9/27392993/refresh-rfbm.png"
                    alt="refresh">

            </button>

        </div>
        
    </div>

</div>

</div>

</div>

</div>

</div>

<div
    id="toast"
    class="toast">

</div>

     <script src="https://fouedb.weebly.com/uploads/2/7/3/9/27392993/rfbm-loader-pro.min.js"></script>   

</body>

</html>
