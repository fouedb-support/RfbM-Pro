<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Radio fouedb Music Playlist">

<title>Radio fouedb Music</title>

<link rel="shortcut icon" href="https://radiofouedbmusic.weebly.com/uploads/2/7/3/9/27392993/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<link rel="manifest" href="/RfbM-Playlists-Player-Pro/manifest.json">

<script src="https://fouedb.weebly.com/uploads/2/7/3/9/27392993/rfbm-loader-pppro.min.js"></script>

</head>

<body>

<div id="playlistLockScreen">

    <div id="playlistLoginBox">

        <h3>Restricted access</h3>

        <input
            type="email"
            id="playlistAccessEmail"
            placeholder="Your e-mail"
            autocomplete="email"
        >

        <input
            type="password"
            id="playlistAccessCode"
            placeholder="Enter your password"
            autocomplete="current-password"
        >

        <button
            id="playlistUnlockBtn"
            type="button"
        >
            Unlock
        </button>

        <a
            id="playlistBackBtn"
            href="https://fouedb-support.github.io/RfbM-Pro/"
            target="_self"
            rel="noopener noreferrer"
        >
            Return To RfbM Radio
        </a>
                
        <a
            id="rfbmSubscribeLink"
            href="https://radiofouedbmusic.weebly.com/subscribe.html"
            target="_blank"
            rel="noopener noreferrer"
        >
            Subscribe to RfbM (Live+Playlists)
        </a>
        
        <div id="playlistErrorMsg"></div>

    </div>

</div>
     
         <button id="autoHidePlaylistToggle" class="auto-hide-playlist-btn active"></button>
         
    <div id="autoHidePlaylistSongInfo">
            
<div id="autoHidePlaylistCoverContainer">
    <img
        id="autoHidePlaylistCover"
        src="https://radiofouedbmusic.weebly.com/noalbum-white.png"
        alt="Album"
    >
</div>

        <div id="autoHidePlaylistTitle"></div>

        <div id="autoHidePlaylistArtist"></div>

        <div id="autoHidePlaylistTimer">

            <span id="autoHidePlaylistElapsed">
                00:00
            </span>
            
            <span class="auto-hide-playlist-separator">

                /

            </span>

            <span id="autoHidePlaylistDuration">
                00:00
            </span>

        </div>

        <div id="autoHidePlaylistProgressContainer">
            <div id="autoHidePlaylistProgressBar">
            <div
                id="autoHidePlaylistProgressThumb"
                class="auto-hide-playlist-progress-thumb">
            </div>
        </div>
        </div>
                    
        <div id="autoHidePlaylistName">RfbM Playlists Player</div>

    </div>

<div
    class="playlist-player"
    id="playlistPlayer"
    style="display:none;">
        
    <a id="playlistBackPlayerBtn" href="https://fouedb-support.github.io/RfbM-Pro/" target="_self" rel="noopener noreferrer" onclick="window.open(this.href, '_self', 'popup=no'); return false;"> R::f.b::M </a>
    
<div class="playlist-panel-bar-container"
     id="playlistPanelBarContainer">

    <div class="playlist-control-row playlist-progress-row">

        <i class="fas fa-tasks"
           id="playlistProgressIcon"
           aria-hidden="true"></i>

        <div class="playlist-panel-progress-track">

            <div id="playlistProgressBar"
                 class="playlist-progress-bar">

                <div id="playlistProgressThumb"
                     class="playlist-progress-thumb">
                </div>

            </div>

        </div>

    </div>
    
    <div class="playlist-control-row playlist-volume-row">

        <i id="playlistMuteBtn"
           class="fas fa-volume-up"
           role="button"
           tabindex="0"
           title="Mute"
           aria-label="Mute the sound"></i>

        <div class="playlist-panel-volume-track">

            <input id="playlistVolume"
                   type="range"
                   min="0"
                   max="100"
                   value="80">

        </div>

    </div>

    </div>

    <div class="playlist-media-layout">
    
    <div class="playlist-cover">

        <img
            id="playlistCover"
            src="https://radiofouedbmusic.weebly.com/uploads/2/7/3/9/27392993/noalbum-white.png"
            alt="Album"
        >

    </div>
      
       
    </div>

    <div class="playlist-info">

        <div
            class="playlist-title"
            id="playlistTitle"
        >
            Select a title
        </div>


        <div
            class="playlist-artist"
            id="playlistArtist"
        >
            Playlist
        </div>

    </div>

    <div class="playlist-controls">

        <button
            id="playlistPrevious"
            title="Previous"
            type="button"
        >
            <i class="fas fa-backward-step" aria-hidden="true"></i>
        </button>
        
        <button
            id="playlistPlay" 
            class="playlist-play" 
            title="Play" 
            type="button"
            >
            <img src="https://radiofouedbmusic.weebly.com/uploads/2/7/3/9/27392993/play-rfbm.png" alt="Play">
        </button>
                
        <button
            id="playlistNext"
            title="Next"
            type="button"
        >
            <i class="fas fa-step-forward" aria-hidden="true"></i>
        </button>
        
    </div>

    <div class="rfbm-audio-modes">

        <label for="rfbmAudioMode">
            Audio Mode
        </label>

        <select id="rfbmAudioMode">

            <option value="autodj" selected>
                Auto-DJ
            </option>

            <option value="fm">
                FM
            </option>

            <option value="hifi">
                HIFI
            </option>

            <option value="podcast">
                Podcast RfbM
            </option>

        </select>

    </div>

    <div class="playlist-options">

        <button
            id="playlistShuffle"
            title="Shuffle"
            type="button"
        >           
            <i class="fas fa-random"></i>
        </button>
        
        <div class="playlist-time">

            <span id="playlistElapsed">00:00</span>
            
            <span class="playlist-separator">

                /

            </span>

            <span id="playlistDuration">00:00</span>

        </div>

        <button
            id="playlistRepeat"
            title="Repeat"
            type="button"
        >         
           <i class="fas fa-refresh"></i>
        </button>

    </div>
            
    <div id="playlistNavigation" class="playlist-navigation">
    
    <div id="rfbmBouquet">

        <button type="button" id="rfbmBouquetOpen">
            <i class="fas fa-list-check" aria-hidden="true"></i>
            My Bouquet
        </button>

    <div id="rfbmBouquetPanel" hidden>

        <h3>Create your own bouquet</h3>

        <p id="rfbmBouquetCount">
            0 selected song
        </p>

        <div class="rfbm-bouquet-actions">

            <button type="button" id="rfbmBouquetSelectAll">
                Select all
            </button>

            <button type="button" id="rfbmBouquetClear">
                Deselect all
            </button>

            <button type="button" id="rfbmBouquetSave">
                <i class="fas fa-save" aria-hidden="true"></i>
                Save my bouquet
            </button>

        </div>

        <label class="rfbm-bouquet-shuffle">
            <input type="checkbox" id="rfbmBouquetShuffle">
            <i class="fas fa-shuffle" aria-hidden="true"></i>
            Shuffle Playback
        </label>

        <input
            type="search"
            id="rfbmBouquetSearch"
            placeholder="Search for a song or an artist..."
            aria-label="Search for a song"
        >

        <div id="rfbmBouquetTracks"></div>

        <button type="button" id="rfbmBouquetPlay">
            <i class="fas fa-play" aria-hidden="true"></i>
            Listen to my bouquet
        </button>

        <button type="button" id="rfbmBouquetClose">
            Close
        </button>

        <p id="rfbmBouquetMessage" role="status"></p>

    </div>
    </div>
    
    <div id="playlistCategoryView">

        <h3 class="playlist-navigation-title">
            Playlists
        </h3>

        <div id="playlistCategoryButtons"
             class="playlist-category-buttons"></div>

    </div>
    
    <div id="playlistChoicesView" style="display:none;">

        <button id="playlistBackToCategories"
                type="button"
                class="playlist-nav-back">
            <i class="fas fa-arrow-left"></i>
            Back
        </button>

        <h3 id="playlistCategoryHeading"
            class="playlist-navigation-title"></h3>

        <div id="playlistChoices"
             class="playlist-choices"></div>

    </div>
    
    <div id="playlistTracksView" style="display:none;">

        <button id="playlistBackToChoices"
                type="button"
                class="playlist-nav-back">
            <i class="fas fa-arrow-left"></i>
            Back to playlists
        </button>

        <h3 id="playlistTracksHeading"
            class="playlist-navigation-title"></h3>

        <div class="playlist-list" id="playlistList"></div>

    </div>
    
    <select id="playlistArtistSelect" style="display:none;"></select>

</div>

</div>

<div
    id="toast"
    class="toast">
</div>

</body>
</html>
